name: compile-sketch

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    env:
      # Channel this build belongs to. The channel follows the SOURCE tree
      # being compiled, not just where it is headed:
      #   base_ref == BETA  -> a feature PR into BETA (compiling BETA-era code)
      #   head_ref == BETA  -> the long-lived BETA -> master integration PR
      #                        (#113). Its source is still BETA's, so it must
      #                        build with BETA's library + flags; without this
      #                        it compiled BETA code against master's pins and
      #                        failed on the sprint headers forever.
      #   ref_name == BETA  -> push / workflow_dispatch on BETA itself
      # Anything else is master/release. The release pin (v4.3.0) already
      # carries CrossingEngine/SprintTimer, so BETA source builds against it
      # too; bump it deliberately — here and in sim-build.yml / release.yml /
      # BirdsEye/sim/CMakeLists.txt — only when the firmware starts needing
      # library code newer than the tag. (The condition is repeated rather
      # than hoisted into its own env var because a job-level `env:` entry
      # cannot reference its siblings.)
      # DovesLapTimer ref: the beta channel tracks the library's own BETA
      # branch so the two move together; everything else pins the known-good
      # release tag.
      LAPTIMER_REF: ${{ (github.base_ref == 'BETA' || github.head_ref == 'BETA' || github.ref_name == 'BETA') && 'BETA' || 'v4.3.0' }}
      # Feature flags for this build (see project.h). BETA enables the
      # SensorEgg POC, the NeoPixel strip and loop profiling exactly as
      # beta.yml does, so the flag-on build is compile-checked on the PR
      # rather than first failing on the publish workflow. Everything else
      # builds the project.h defaults — which since 4.1.0 means the
      # NeoPixel strip is ON (it is a core feature now; the flag defaults
      # to 1) and only the SensorEgg POC and profiling are off. So the
      # difference between the two arms is SensorEgg, profiling, and the
      # DovesLapTimer ref.
      FEATURE_FLAGS: ${{ (github.base_ref == 'BETA' || github.head_ref == 'BETA' || github.ref_name == 'BETA') && '-DBIRDSEYE_ENABLE_SENSOREGG=1 -DBIRDSEYE_ENABLE_NEOPIXEL=1 -DBIRDSEYE_ENABLE_PROFILING=1' || '' }}
    # Build both XIAO nRF52840 variants. The Sense board has the onboard
    # LSM6DS3 IMU; the plain board does not (accelerometer logging degrades
    # gracefully). Same MCU/BLE/bootloader otherwise.
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: xiao-nrf52840-sense
            fqbn: Seeeduino:nrf52:xiaonRF52840Sense
            define: BIRDSEYE_BOARD_SENSE
          - name: xiao-nrf52840
            fqbn: Seeeduino:nrf52:xiaonRF52840
            define: BIRDSEYE_BOARD_NONSENSE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seeed nRF52 BSP shells out to adafruit-nrfutil during link to
      # package the .hex into a .zip, even when only compiling — install
      # it before the compile step.
      - name: Install adafruit-nrfutil
        run: pip install --user adafruit-nrfutil

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: Seeeduino:nrf52
              source-url: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          libraries: |
            - name: ArduinoJson
            - name: SdFat - Adafruit Fork
            - name: Adafruit GFX Library
            - name: Adafruit SH110X
            - name: Adafruit SSD1306
            - name: SparkFun u-blox GNSS v3
            - name: Seeed Arduino LSM6DS3
            - name: ArxTypeTraits
            - name: Adafruit NeoPixel
            - source-url: https://github.com/TheAngryRaven/DovesLapTimer.git
              version: ${{ env.LAPTIMER_REF }}
          sketch-paths: |
            - BirdsEye
          # SERIAL_BUFFER_SIZE grows the core's Serial1 RX/TX rings 64->256 B
          # (guarded #ifndef in the BSP's RingBuffer.h) so SoftDevice radio-ISR
          # deferral of the TIMER3 GPS drain can't overflow the core ring.
          # project.h static_asserts on it — keep all three workflows in sync.
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=-D${{ matrix.board.define }} -DSERIAL_BUFFER_SIZE=256 -DDOVES_DISABLE_DEBUG ${{ env.FEATURE_FLAGS }}
          enable-deltas-report: true

      # Hard flash-size gate. The XIAO nRF52840's app flash is shared
      # with the SoftDevice + bootloader; running it dry bricks OTA and
      # leaves no room to grow. Fail the build if the sketch uses more
      # than FLASH_BUDGET_PERCENT of the BSP-reported maximum. Uses the
      # absolute usage from the compile report (no base-branch compare
      # needed) and degrades to a warning if the report can't be parsed.
      - name: Flash size budget gate
        env:
          FLASH_BUDGET_PERCENT: 90
        run: |
          report="$(find sketches-reports -name '*.json' | head -1)"
          if [ -z "$report" ]; then
            echo "::warning::No compile report found — skipping size gate"
            exit 0
          fi
          echo "Reading $report"
          echo "Flash size entry:"
          jq -c '[.boards[].sketches[].sizes[] | select(.name=="flash")][0]' "$report" || true
          # The arduino/compile-sketches report nests usage under
          # .current.absolute (current schema). Fall back to older shapes
          # (.absolute.current, flat .absolute) and keep only a number, so a
          # schema change degrades visibly rather than silently passing.
          flash_abs="$(jq -r '
            [.boards[].sketches[].sizes[]
             | select(.name=="flash")
             | (.current.absolute? // .absolute.current? // .absolute?)]
            | map(select(type=="number")) | first // empty' "$report")"
          flash_max="$(jq -r '
            [.boards[].sketches[].sizes[]
             | select(.name=="flash") | .maximum]
            | map(select(type=="number")) | first // empty' "$report")"
          if [ -z "$flash_abs" ] || [ -z "$flash_max" ] || [ "$flash_max" = "0" ]; then
            echo "::warning::Could not read flash usage from report — skipping size gate"
            exit 0
          fi
          pct="$(awk "BEGIN { printf \"%.1f\", ($flash_abs / $flash_max) * 100 }")"
          echo "Flash: ${flash_abs} / ${flash_max} bytes (${pct}%), budget ${FLASH_BUDGET_PERCENT}%"
          over="$(awk "BEGIN { print (($flash_abs / $flash_max) * 100 > ${FLASH_BUDGET_PERCENT}) ? 1 : 0 }")"
          if [ "$over" = "1" ]; then
            echo "::error::Flash usage ${pct}% exceeds budget ${FLASH_BUDGET_PERCENT}% — reduce footprint or raise the budget deliberately"
            exit 1
          fi

      # OTA image-size gate. The SD-staged OTA path can only deliver an image
      # up to FW_MAX_IMAGE_SIZE (firmware_ota.ino) — FWBEGIN rejects anything
      # larger with FWERR:SIZE, and the staging region carved out below the
      # bootloader is exactly that size. The program's flash usage equals the
      # app .bin that gets streamed/flashed, so gate it against that cap: warn
      # as it approaches, fail if it crosses (the image would be un-OTA-able).
      #
      # There are TWO caps, because the cap lives in the *installed* firmware,
      # not in the image being delivered:
      #   OTA_IMAGE_MAX_BYTES  — this layout's cap. Hard failure past it.
      #   OTA_LEGACY_MAX_BYTES — the cap on units still running <= 3.0.x, which
      #     stage at the old 0xA4000. Those units reject a larger image with
      #     FWERR:SIZE and would need the USB UF2 path (FWDFU) instead, so
      #     crossing it is a warning: it means the fleet has split.
      # Drop the legacy warning once every unit you care about has taken a
      # build carrying the 0x8E000 layout.
      - name: OTA image size gate
        env:
          # Keep in sync with FW_MAX_IMAGE_SIZE in BirdsEye/firmware_ota.ino.
          OTA_IMAGE_MAX_BYTES: 417792   # 408 KiB
          OTA_LEGACY_MAX_BYTES: 327680  # 320 KiB — pre-3.1 staging layout
          OTA_WARN_PERCENT: 90
        run: |
          report="$(find sketches-reports -name '*.json' | head -1)"
          if [ -z "$report" ]; then
            echo "::warning::No compile report found — skipping OTA image gate"
            exit 0
          fi
          flash_abs="$(jq -r '
            [.boards[].sketches[].sizes[]
             | select(.name=="flash")
             | (.current.absolute? // .absolute.current? // .absolute?)]
            | map(select(type=="number")) | first // empty' "$report")"
          if [ -z "$flash_abs" ]; then
            echo "::warning::Could not read flash usage from report — skipping OTA image gate"
            exit 0
          fi
          pct="$(awk "BEGIN { printf \"%.1f\", ($flash_abs / $OTA_IMAGE_MAX_BYTES) * 100 }")"
          echo "OTA image: ${flash_abs} / ${OTA_IMAGE_MAX_BYTES} bytes (${pct}% of the OTA cap)"
          if [ "$flash_abs" -gt "$OTA_IMAGE_MAX_BYTES" ]; then
            echo "::error::Image ${flash_abs} B exceeds the OTA cap ${OTA_IMAGE_MAX_BYTES} B — FWBEGIN would reject it (FWERR:SIZE). Shrink the image, or finish plan 0004's SD-direct apply (which removes the staging region and the cap with it)."
            exit 1
          fi
          warn="$(awk "BEGIN { print (($flash_abs / $OTA_IMAGE_MAX_BYTES) * 100 >= ${OTA_WARN_PERCENT}) ? 1 : 0 }")"
          if [ "$warn" = "1" ]; then
            echo "::warning::OTA image at ${pct}% of the ${OTA_IMAGE_MAX_BYTES} B cap (>= ${OTA_WARN_PERCENT}%) — getting close to un-OTA-able; plan to shrink or raise the cap."
          fi
          # Fleet-split check: an image past the legacy cap can no longer be
          # installed by units still running the pre-3.1 staging layout.
          if [ "$flash_abs" -gt "$OTA_LEGACY_MAX_BYTES" ]; then
            echo "::warning::Image ${flash_abs} B exceeds the legacy ${OTA_LEGACY_MAX_BYTES} B cap — units still on <= 3.0.x will answer FWERR:SIZE and can only take this build over USB (FWDFU -> UF2). Ship a <= ${OTA_LEGACY_MAX_BYTES} B build first if any such unit still needs to migrate."
          fi

      - name: Upload size deltas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-deltas-${{ matrix.board.name }}
          path: sketches-reports
          if-no-files-found: ignore

  # Flag-OFF compile, for BETA-targeted work only.
  #
  # The `compile` job above picks ONE flag set per PR: BETA-targeted work
  # builds with SensorEgg + profiling ON, everything else with them off.
  # That means code inside a `#else` arm of one of those flags reaches
  # master having never been through a compiler — and plan 0013 added
  # several (the DOVEX row/header shapes and the settings defaults now
  # differ by channel). This job closes that hole from the BETA side.
  #
  # Both boards: this arm is also the RELEASE configuration (project.h
  # defaults, no feature flags), and release.yml ships both images — the
  # non-Sense board has its own `#if` paths (no IMU) that must compile
  # with the flags off too.
  #
  # Library ref:
  #   head_ref == BETA (the BETA -> master release PR): the release pin,
  #     so this job compiles exactly what release.yml will build — release
  #     library + no flags, both boards. Without it the release PR never
  #     compiled BETA source against the pinned library at all, and a
  #     library dependency newer than the tag first failed on the tag push.
  #   otherwise (feature PRs into BETA, pushes to BETA): BETA, so the flags
  #     are the ONLY variable between this job and the flags-on build above.
  # Keep the pin in sync with LAPTIMER_REF above and with release.yml.
  compile-stock-arm:
    name: ${{ matrix.board.name }} (flags off)
    if: >-
      github.base_ref == 'BETA' || github.head_ref == 'BETA' ||
      github.ref_name == 'BETA'
    runs-on: ubuntu-latest
    env:
      STOCK_LAPTIMER_REF: ${{ github.head_ref == 'BETA' && 'v4.3.0' || 'BETA' }}
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: xiao-nrf52840-sense
            fqbn: Seeeduino:nrf52:xiaonRF52840Sense
            define: BIRDSEYE_BOARD_SENSE
          - name: xiao-nrf52840
            fqbn: Seeeduino:nrf52:xiaonRF52840
            define: BIRDSEYE_BOARD_NONSENSE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install adafruit-nrfutil
        run: pip install --user adafruit-nrfutil

      - name: Report configuration
        run: echo "Flags off, DovesLapTimer ref ${STOCK_LAPTIMER_REF}, board ${{ matrix.board.fqbn }}"

      - name: Compile sketch with the feature flags off
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: Seeeduino:nrf52
              source-url: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          libraries: |
            - name: ArduinoJson
            - name: SdFat - Adafruit Fork
            - name: Adafruit GFX Library
            - name: Adafruit SH110X
            - name: Adafruit SSD1306
            - name: SparkFun u-blox GNSS v3
            - name: Seeed Arduino LSM6DS3
            - name: ArxTypeTraits
            - name: Adafruit NeoPixel
            - source-url: https://github.com/TheAngryRaven/DovesLapTimer.git
              version: ${{ env.STOCK_LAPTIMER_REF }}
          sketch-paths: |
            - BirdsEye
          # Exactly release.yml's extra_flags — nothing else.
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=-D${{ matrix.board.define }} -DSERIAL_BUFFER_SIZE=256 -DDOVES_DISABLE_DEBUG
